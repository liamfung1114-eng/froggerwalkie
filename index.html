<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Robot Frogger · slow & simple</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #1f3b1f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 12px;
        }
        .game-area {
            background: #1f3b1f;
            padding: 10px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            max-width: 680px;
            width: 100%;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            background: #2a6b2a;
            width: 100%;
            height: auto;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            cursor: crosshair;
            touch-action: none;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 4px;
            color: #e9f5d0;
            font-weight: bold;
            font-size: 1.3rem;
            text-shadow: 2px 2px 0 #0a1f0a;
        }
        .score {
            background: #0d2b0d;
            padding: 4px 18px;
            border-radius: 40px;
            letter-spacing: 1px;
            box-shadow: inset 0 -2px 0 #4a7a4a;
        }
        .restart {
            background: #e7b42e;
            border: none;
            font-size: 1.3rem;
            padding: 4px 18px 6px;
            border-radius: 40px;
            font-weight: 800;
            color: #1e2a0e;
            box-shadow: 0 4px 0 #8f6f1a;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.05s linear;
            transform: translateY(-1px);
        }
        .restart:active {
            box-shadow: 0 1px 0 #8f6f1a;
            transform: translateY(3px);
        }
        .hint {
            text-align: center;
            margin-top: 8px;
            color: #b8d9a4;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
<div class="game-area">
    <div class="top-bar">
        <span class="score">🏆 <span id="scoreDisplay">0</span></span>
        <button class="restart" id="restartButton">↻ RESTART</button>
    </div>
    <canvas id="gameCanvas" width="640" height="480"></canvas>
    <div class="hint">🤖 arrow keys / swipe · slow cars · reach 🏁</div>
</div>
<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');

        const COLS = 8;
        const ROWS = 9;
        const CELL_W = canvas.width / COLS;
        const CELL_H = canvas.height / ROWS;

        let score = 0;
        let robot = { col: 3, row: 0 };
        let cars = [];

        const carEmojis = ['🚗', '🚙', '🚕', '🚌', '🚚', '🚓'];

        function resetCars() {
            cars = [];
            const roadRows = [2, 3, 4, 5, 6];
            roadRows.forEach(row => {
                const carCount = (row % 2 === 0) ? 3 : 2;
                const dir = (row % 2 === 0) ? 1 : -1;
                for (let i = 0; i < carCount; i++) {
                    const col = (i * 3 + row * 2) % COLS;
                    const emoji = carEmojis[Math.floor(Math.random() * carEmojis.length)];
                    const speed = 0.008 + Math.random() * 0.010;
                    cars.push({ fCol: col, row, dir, emoji, speed });
                }
            });
        }

        function resetGame() {
            robot = { col: 3, row: 0 };
            score = 0;
            updateScore();
            resetCars();
        }

        function updateScore() {
            scoreSpan.textContent = score;
        }

        function checkCollision() {
            for (const car of cars) {
                const carCol = Math.round(car.fCol);
                const wrappedCol = ((carCol % COLS) + COLS) % COLS;
                if (car.row === robot.row && wrappedCol === robot.col) return true;
            }
            return false;
        }

        function moveRobot(direction) {
            let newCol = robot.col;
            let newRow = robot.row;

            if (direction === 'up') newRow = Math.min(robot.row + 1, ROWS - 1);
            if (direction === 'down') newRow = Math.max(robot.row - 1, 0);
            if (direction === 'left') newCol = Math.max(robot.col - 1, 0);
            if (direction === 'right') newCol = Math.min(robot.col + 1, COLS - 1);

            if (newCol === robot.col && newRow === robot.row) return;

            const oldCol = robot.col;
            const oldRow = robot.row;
            robot.col = newCol;
            robot.row = newRow;

            if (checkCollision()) {
                robot.col = oldCol;
                robot.row = oldRow;
                return;
            }

            if (robot.row === ROWS - 1) {
                score++;
                updateScore();
                robot.col = 3;
                robot.row = 0;
                resetCars();
            }
        }

        function updateCars() {
            for (const car of cars) {
                car.fCol += car.dir * car.speed;
                if (car.fCol > COLS + 0.5) car.fCol = -1.0;
                else if (car.fCol < -1.0) car.fCol = COLS + 0.5;
            }
        }

        function checkCollisionAfterMove() {
            for (const car of cars) {
                const carCol = Math.round(car.fCol);
                const wrappedCol = ((carCol % COLS) + COLS) % COLS;
                if (car.row === robot.row && wrappedCol === robot.col) {
                    robot.col = 3;
                    robot.row = 0;
                    resetCars();
                    break;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let row = 0; row < ROWS; row++) {
                const y = canvas.height - (row + 1) * CELL_H;
                let fillColor = '#2e7d32';

                if (row === 0) fillColor = '#4caf50';
                else if (row === 1) fillColor = '#388e3c';
                else if (row >= 2 && row <= 6) fillColor = '#2c3e50';
                else if (row === 7) fillColor = '#388e3c';
                else if (row === 8) fillColor = '#b8860b';

                ctx.fillStyle = fillColor;
                ctx.fillRect(0, y, canvas.width, CELL_H);

                if (row >= 2 && row <= 6) {
                    ctx.fillStyle = '#f1c40f';
                    const dashY = y + CELL_H * 0.5;
                    for (let col = 0; col < COLS; col++) {
                        const dashX = col * CELL_W + CELL_W * 0.25;
                        ctx.fillRect(dashX, dashY - 2, CELL_W * 0.5, 4);
                    }
                }

                ctx.strokeStyle = '#00000022';
                ctx.lineWidth = 1;
                for (let col = 0; col <= COLS; col++) {
                    ctx.beginPath();
                    ctx.moveTo(col * CELL_W, y);
                    ctx.lineTo(col * CELL_W, y + CELL_H);
                    ctx.stroke();
                }
            }

            const goalY = canvas.height - 9 * CELL_H;
            for (let col = 0; col < COLS; col++) {
                ctx.fillStyle = (col % 2 === 0) ? '#f5e6b0' : '#d4af37';
                ctx.fillRect(col * CELL_W, goalY, CELL_W, CELL_H);
                ctx.font = `${CELL_H * 0.5}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#00000055';
                ctx.fillText('🏁', col * CELL_W + CELL_W / 2, goalY + CELL_H / 2 + 2);
                ctx.fillStyle = '#ffffffdd';
                ctx.fillText('🏁', col * CELL_W + CELL_W / 2, goalY + CELL_H / 2);
            }

            cars.forEach(car => {
                let displayCol = car.fCol;
                if (displayCol > COLS) displayCol -= COLS;
                if (displayCol < -0.5) displayCol += COLS;

                const x = displayCol * CELL_W + CELL_W / 2;
                const y = canvas.height - (car.row + 1) * CELL_H + CELL_H / 2;

                ctx.shadowColor = '#00000080';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetY = 3;
                ctx.font = `${CELL_H * 0.8}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                ctx.fillText(car.emoji, x, y);
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;
            });

            const robotX = robot.col * CELL_W + CELL_W / 2;
            const robotY = canvas.height - (robot.row + 1) * CELL_H + CELL_H / 2;

            ctx.shadowColor = '#66ddff';
            ctx.shadowBlur = 16;
            ctx.font = `${CELL_H * 0.9}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff';
            ctx.fillText('🤖', robotX, robotY);
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            updateCars();
            checkCollisionAfterMove();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function handleKey(e) {
            const key = e.key;
            if (key.startsWith('Arrow')) e.preventDefault();
            if (key === 'ArrowUp') moveRobot('up');
            else if (key === 'ArrowDown') moveRobot('down');
            else if (key === 'ArrowLeft') moveRobot('left');
            else if (key === 'ArrowRight') moveRobot('right');
        }

        let touchStartX = 0;
        let touchStartY = 0;
        let touchMoved = false;

        function handleTouchStart(e) {
            e.preventEvent?.();
            e.preventDefault();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            touchMoved = false;
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (touchMoved || e.touches.length === 0) return;
            const touch = e.touches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);

            if (Math.max(absDx, absDy) < 18) return;

            touchMoved = true;
            if (absDx > absDy) {
                moveRobot(dx > 0 ? 'right' : 'left');
            } else {
                moveRobot(dy > 0 ? 'down' : 'up');
            }
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            touchMoved = false;
        }

        document.getElementById('restartButton').addEventListener('click', () => {
            resetGame();
            draw();
        });

        window.addEventListener('keydown', handleKey);
        canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        canvas.addEventListener('touchend', handleTouchEnd);
        canvas.addEventListener('touchcancel', handleTouchEnd);

        resetGame();
        draw();
        gameLoop();
    })();
</script>
</body>
</html>
